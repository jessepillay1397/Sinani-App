<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}Sinani App{% endblock %}</title>

  <!-- Bootstrap -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <!-- Your app’s CSS -->
  <link
    href="{{ url_for('static', filename='css/style.css') }}"
    rel="stylesheet"
  >

  <!-- Inline override to guarantee the correct URL for your background -->
  <style>
    body {
      background: url('{{ url_for("static", filename="images/bg.jpg") }}')
                  no-repeat center center fixed;
      background-size: cover;
    }
  </style>
</head>

<body>
  <nav class="navbar navbar-light bg-white shadow-sm mb-4">
    <div class="container">
      <a class="navbar-brand" href="{{ url_for('home') }}">
        <img
          src="{{ url_for('static', filename='images/sinani-logo.png') }}"
          alt="Sinani Logo"
        >
      </a>
    </div>
  </nav>

  <div class="container">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
