{% extends "base.html" %}
{% block title %}Edit Trip Log – Sinani{% endblock %}

{% block content %}
  <h2>Edit Trip Log</h2>
  <form method="POST" action="{{ url_for('update_trip_log') }}">
    <input type="hidden" name="idx" value="{{ idx }}">
    <div class="row">
      {% for key, value in data.items() %}
      <div class="col-md-4 mb-3">
        <label class="form-label">{{ key }}</label>
        <input type="text" name="{{ key }}" value="{{ value }}" class="form-control">
      </div>
      {% endfor %}
    </div>
    <button class="btn btn-success">Save Changes</button>
    <a href="{{ url_for('trip_logs') }}" class="btn btn-secondary">Cancel</a>
  </form>
{% endblock %}
